<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MUSIC</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">

  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --card-hover: #2a2a2a;
      --accent-color: #4EAFD9;
      --text-main: #ffffff;
      --text-secondary: #b3b3b3;
      --border-color: #282828;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      max-width: 100%;
      margin: 0 auto;
      background-color: var(--bg-color);
    }

    /* REPRODUCTOR SUPERIOR */
    /* REPRODUCTOR (Estils generals i mòbil) */
    .player-section {
      padding: 16px 20px 10px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;       /* Centra horitzontalment */
      justify-content: center;  /* Centra verticalment */
      text-align: center;
      background: linear-gradient(180deg, #1f2d34 0%, var(--bg-color) 100%);
      flex-shrink: 0;
      width: 100%;
    }

    /* REPRODUCTOR EN PC (Ajust per mantenir el centrat perfecte) */
    @media (min-width: 768px) {
    .player-section {
      flex: 1;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;       /* Assegura el centrat horitzontal en PC */
      justify-content: center;  /* Assegura el centrat vertical en PC */
      border-right: 1px solid var(--border-color);
    }
  }

    .app-title {
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .album-art {
      width: 150px;
      height: 150px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.7);
      margin-bottom: 12px;
      background-color: var(--card-bg);
    }

    .album-art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .track-info {
      text-align: center;
      margin-bottom: 12px;
      width: 100%;
      max-width: 320px;
    }

    .track-info h2 {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-info p {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    /* BARRA DE PROGRÉS */
    .progress-box {
      width: 100%;
      max-width: 320px;
      margin-bottom: 12px;
    }

    .progress-bar {
      width: 100%;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      border-radius: 2px;
      background: #3e3e3e;
      outline: none;
    }

    .progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent-color);
      cursor: pointer;
    }

    .time-stamps {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    /* BOTONS AMB ICONES SVG */
    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 320px;
    }

    .btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn svg {
     width: 22px;
     height: 22px;
     fill: var(--text-secondary);
     transition: fill 0.2s ease, transform 0.2s ease;
    }

    .btn.active svg {
     fill: var(--accent-color) !important;
     transform: scale(1.1); /* Li dóna un petit efecte de relleu en activar-se */
    }

    .btn-play {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background-color: var(--accent-color);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-play svg {
      fill: #000000;
      width: 24px;
      height: 24px;
    }

    /* LLISTA INFERIOR I BOTONS DE SELECCIÓ DE LLISTA */
    .playlist-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 12px 20px;
      border-top: 1px solid var(--border-color);
      background-color: var(--bg-color);
    }

    .section-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--text-secondary);
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .playlist-selector {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 12px;
      flex-shrink: 0;
    }

    /* SOLUCIÓ AL TEXT INVISIBLE DE LES LLISTES */
    .tab-btn {
      background-color: var(--card-bg);
      color: var(--text-main) !important;
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }

    .tab-btn.active {
      background-color: var(--accent-color);
      color: #000000 !important; /* Text negre ben visible quan el botó és blau */
      border-color: var(--accent-color);
    }

    .song-list {
      list-style: none;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .song-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-radius: 8px;
      background-color: var(--card-bg);
      cursor: pointer;
    }

    .song-item.active {
      border: 1px solid var(--accent-color);
      background-color: #1a272e;
    }

    .song-item.active .song-title {
      color: var(--accent-color);
      font-weight: bold;
    }

    .song-title {
      font-size: 14px;
      color: var(--text-main);
    }

    .song-artist {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .song-duration {
      font-size: 12px;
      color: var(--text-secondary);
    }

    /* ADAPTACIÓ PER A ORDINADOR */
    @media (min-width: 768px) {
      .app-container {
        flex-direction: row;
        max-width: 1000px;
        height: 85vh;
        margin: 7.5vh auto;
        border-radius: 16px;
        border: 1px solid var(--border-color);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      }

      .player-section {
        flex: 1;
        padding: 40px;
        border-right: 1px solid var(--border-color);
      }

      .album-art {
        width: 220px;
        height: 220px;
      }

      .playlist-section {
        flex: 1.2;
        padding: 30px;
        border-top: none;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <div class="player-section">
      <div class="app-title">MUSIC</div>

      <div class="album-art">
        <img src="logo.png" alt="Portada">
      </div>

      <div class="track-info">
        <h2 id="track-title">Selecciona una cançó</h2>
        <p id="track-artist">-</p>
      </div>

      <div class="progress-box">
        <input type="range" id="progress-bar" class="progress-bar" value="0" min="0" step="0.1">
        <div class="time-stamps">
          <span id="current-time">0:00</span>
          <span id="total-time">0:00</span>
        </div>
      </div>

      <div class="controls">
        <button class="btn" id="shuffle-btn" title="Aleatori">
          <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.45 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
        </button>
        <button class="btn" id="prev-btn" title="Anterior">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="btn btn-play" id="play-btn" title="Reproduir / Pausar">
          <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="btn" id="next-btn" title="Següent">
          <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
        <button class="btn" id="repeat-btn" title="Repetir">
          <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v3z"/></svg>
        </button>
      </div>
    </div>

    <div class="playlist-section">
      <div class="section-label">Llistes</div>
      <div class="playlist-selector" id="playlist-selector"></div>

      <div class="section-label">Cançons</div>
      <ul class="song-list" id="song-list"></ul>
    </div>

  </div>

  <audio id="audio-player"></audio>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(err => console.error(err));
    }

    const playlists = {
      "pop": {
        name: "Pop Hits",
        songs: [
          { title: "IDK IDK", artist: "B1llyGr4c3", src: "idk idk.mp3", duration: "3:15" },
          { title: "Feel You", artist: "Artista A", src: "Feel You.mp3", duration: "2:58" }
          { title: "Africa", artist: "Toto", src: "Africa.mp3", duration: "4:55" },
          { title: "Hold the Line", artist: "Toto", src: "Hold the Line.mp3", duration: "3:55" },
          { title: "You Make My Dreams", artist: "Daryl Hall & John Oates", src: "You Make My Dreams.mp3", duration: "3:11" },
          { title: "A Horse with No Name", artist: "America", src: "A Horse with No Name.mp3", duration: "4:12" }
        ]
      }
    };

    let currentPlaylistKey = "pop";
    let currentSongIndex = 0;
    let isPlaying = false;
    let isShuffle = false;
    let isRepeat = false;

    const audioPlayer = document.getElementById("audio-player");
    const playBtn = document.getElementById("play-btn");
    const playIcon = document.getElementById("play-icon");
    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");
    const shuffleBtn = document.getElementById("shuffle-btn");
    const repeatBtn = document.getElementById("repeat-btn");
    
    const trackTitle = document.getElementById("track-title");
    const trackArtist = document.getElementById("track-artist");
    const progressBar = document.getElementById("progress-bar");
    const currentTimeEl = document.getElementById("current-time");
    const totalTimeEl = document.getElementById("total-time");
    
    const playlistSelector = document.getElementById("playlist-selector");
    const songListContainer = document.getElementById("song-list");

    function init() {
      renderPlaylists();
      loadPlaylist(currentPlaylistKey);
      setupEventListeners();
    }

    function renderPlaylists() {
      playlistSelector.innerHTML = "";
      Object.keys(playlists).forEach(key => {
        const btn = document.createElement("button");
        btn.classList.add("tab-btn");
        if (key === currentPlaylistKey) btn.classList.add("active");
        btn.textContent = playlists[key].name;
        btn.addEventListener("click", () => {
          document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          loadPlaylist(key);
        });
        playlistSelector.appendChild(btn);
      });
    }

    function loadPlaylist(key) {
      currentPlaylistKey = key;
      currentSongIndex = 0;
      renderSongList();
      loadSong(currentSongIndex, false);
    }

    function renderSongList() {
      songListContainer.innerHTML = "";
      const currentSongs = playlists[currentPlaylistKey].songs;

      currentSongs.forEach((song, index) => {
        const li = document.createElement("li");
        li.classList.add("song-item");
        if (index === currentSongIndex) li.classList.add("active");

        li.innerHTML = `
          <div>
            <div class="song-title">${song.title}</div>
            <div class="song-artist">${song.artist}</div>
          </div>
          <div class="song-duration">${song.duration}</div>
        `;

        li.addEventListener("click", () => {
          currentSongIndex = index;
          renderSongList();
          loadSong(currentSongIndex, true);
        });

        songListContainer.appendChild(li);
      });
    }

    function loadSong(index, shouldPlay = false) {
      const song = playlists[currentPlaylistKey].songs[index];
      if (!song) return;

      audioPlayer.src = song.src;
      trackTitle.textContent = song.title;
      trackArtist.textContent = song.artist;

      if (shouldPlay) playSong();
      else pauseSong();
    }

    function playSong() {
      isPlaying = true;
      audioPlayer.play().catch(() => {});
      playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'; // Icona Pausa
    }

    function pauseSong() {
      isPlaying = false;
      audioPlayer.pause();
      playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>'; // Icona Play
    }

    function nextSong() {
      const songs = playlists[currentPlaylistKey].songs;
      currentSongIndex = isShuffle ? Math.floor(Math.random() * songs.length) : (currentSongIndex + 1) % songs.length;
      renderSongList();
      loadSong(currentSongIndex, true);
    }

    function prevSong() {
      const songs = playlists[currentPlaylistKey].songs;
      currentSongIndex = isShuffle ? Math.floor(Math.random() * songs.length) : (currentSongIndex - 1 + songs.length) % songs.length;
      renderSongList();
      loadSong(currentSongIndex, true);
    }

    function setupEventListeners() {
      playBtn.addEventListener("click", () => isPlaying ? pauseSong() : playSong());
      nextBtn.addEventListener("click", nextSong);
      prevBtn.addEventListener("click", prevSong);

      shuffleBtn.addEventListener("click", () => {
        isShuffle = !isShuffle;
        shuffleBtn.classList.toggle("active", isShuffle);
      });

      repeatBtn.addEventListener("click", () => {
        isRepeat = !isRepeat;
        repeatBtn.classList.toggle("active", isRepeat);
      });

      audioPlayer.addEventListener("timeupdate", () => {
        if (audioPlayer.duration) {
          progressBar.value = (audioPlayer.currentTime / audioPlayer.duration) * 100;
          currentTimeEl.textContent = formatTime(audioPlayer.currentTime);
          totalTimeEl.textContent = formatTime(audioPlayer.duration);
        }
      });

      progressBar.addEventListener("input", () => {
        if (audioPlayer.duration) {
          audioPlayer.currentTime = (progressBar.value / 100) * audioPlayer.duration;
        }
      });

      audioPlayer.addEventListener("ended", () => isRepeat ? loadSong(currentSongIndex, true) : nextSong());
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    init();
  </script>
</body>
</html>
