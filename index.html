<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MUSIC</title>
  <link rel="icon" href="logo.png" type="image/png">
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #575757;
      --card-bg2: #D6D6D6;
      --accent-color: #4EAFD9;
      --text-main: #000;
      --title-main: #fff;
      --text-secondary: #7D7C7C;
      --border-color: #000000;
      --border-color2: #333;

    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Barra Superior */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #333;
      padding: 10px 20px;
    }

    .navbar h1 {
      margin: 0;
      font-size: 20px;
      color: var(--title-main);
    }


    /* Contenidor Principal (Layout de 2 columnes en pantalles grans) */
    .main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
      flex-direction: column;
    }

    @media (min-width: 768px) {
      .main-container {
        flex-direction: row;
      }
    }

    /* Panell de Selecció de Llistes i Cançons */
    .sidebar {
      flex: 1;
      background-color: var(--card-bg2);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 15px;
    }

    .section-title {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-secondary);
      margin-bottom: 10px;
      margin-top: 15px;
    }

    .section-title:first-child {
      margin-top: 0;
    }

    /* Selector de Llistes de Reproducció */
    .playlist-selector {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      overflow-x: auto;
      padding-bottom: 5px;
    }

    .playlist-btn {
      background-color: #2a2a2a;
      color: var(--title-main);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s, color 0.2s;
    }

    .playlist-btn.active, .playlist-btn:hover {
      background-color: var(--accent-color);
      color: #000;
      font-weight: bold;
    }

    /* Llista de Cançons */
    .song-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .song-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: 6px;
      cursor: pointer;
      background-color: transparent;
      transition: background 0.2s;
    }

    .song-item:hover {
      background-color: #2a2a2a;
    }

    .song-item.active {
      background-color: #2a2a2a;
    }

    .song-item.active .song-info .title {
      color: var(--accent-color);
      font-weight: bold;
    }

    .song-info {
      display: flex;
      flex-direction: column;
    }

    .song-info .title {
      font-size: 15px;
      color: var(--text-main);
    }

    .song-info .artist {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .song-duration {
      font-size: 12px;
      color: var(--text-secondary);
    }

    /* Panell del Reproductor */
    .player-panel {
      flex: 1;
      background-color: #212121;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
    }

    .album-art {
      width: 220px;
      height: 220px;
      background-color: #575757;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 64px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      margin-bottom: 25px;
    }

    .current-track-info {
      text-align: center;
      margin-bottom: 20px;
    }

    .current-track-info h2 {
      font-size: 20px;
      margin-bottom: 5px;
    }

    .current-track-info p {
      font-size: 14px;
      color: var(--text-secondary);
    }

    /* Barra de Progrés */
    .progress-container {
      width: 100%;
      max-width: 400px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 25px;
    }

    .progress-time {
      font-size: 12px;
      color: var(--text-secondary);
      width: 35px;
    }

    .progress-bar {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 5px;
      border-radius: 5px;
      background: #404040;
      outline: none;
      cursor: pointer;
    }

    .progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 10px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent-color);
      cursor: pointer;
    }

    /* Controls de Reproducció */
    .controls {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .control-btn.play-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background-color: var(--accent-color);
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .control-btn.play-btn:hover {
      transform: scale(1.05);
      color: #000;
    }
	.control-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 20px;
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
      transition: color 0.2s, transform 0.1s, background-color 0.2s;
    }

    .control-btn:hover {
      color: var(--title-main);
    }

    .control-btn:active {
      transform: scale(0.95);
    }

    .control-btn.active {
      color: var(--accent-color);
      background-color: rgba(78, 175, 217, 0.15);
      border: 1px solid var(--accent-color);
    }
  </style>
</head>
<body>

  <!-- Barra Superior -->
  <div class="navbar">
    <h1>Reproductor de Música</h1>
  </div>

  <!-- Contenidor Principal -->
  <div class="main-container">

    <!-- Panell Lateral: Selecció de Llistes i Cançons -->
    <div class="sidebar">
      <div class="section-title">Llistes de Reproducció</div>
      <div class="playlist-selector" id="playlist-selector">
      </div>

      <div class="section-title">Cançons</div>
      <ul class="song-list" id="song-list">
      </ul>
    </div>

    <!-- Panell Principal: Dispositiu Reproductor -->
    <div class="player-panel">
      <div class="album-art" id="album-art">🎵</div>

      <div class="current-track-info">
        <h2 id="track-title">Cap cançó seleccionada</h2>
        <p id="track-artist">-</p>
      </div>

      <div class="progress-container">
        <span class="progress-time" id="current-time">0:00</span>
        <input type="range" id="progress-bar" class="progress-bar" value="0" min="0" step="0.1">
        <span class="progress-time" id="total-time">0:00</span>
      </div>

      <div class="controls">
        <button class="control-btn" id="shuffle-btn" title="Activar/Desactivar Mode Aleatori">🔀</button>
        <button class="control-btn" id="prev-btn" title="Cançó Anterior">⏮</button>
        <button class="control-btn play-btn" id="play-btn" title="Reproduir / Pausar">▶</button>
        <button class="control-btn" id="next-btn" title="Cançó Següent">⏭</button>
        <button class="control-btn" id="repeat-btn" title="Activar/Desactivar Repetició">🔁</button>
      </div>
    </div>

  </div>

  <!-- Element Àudio de HTML5 (Ocult) -->
  <audio id="audio-player"></audio>

  <script>
    // 1. Estructura de Dades de les Llistes de Reproducció
    const playlists = {
      "pop": {
        name: "Pop Hits",
        songs: [
          { title: "IDK IDK", artist: "B1llyGr4c3", src: "idk idk.mp3", duration: "3:15" },
          { title: "Feel You", artist: "Artista A", src: "Feel You.mp3", duration: "2:58" }
        ]
      },
      "rock": {
        name: "Rock Classic",
        songs: [
          { title: "Tercera Cançó Rock", artist: "Banda Rock", src: "tercera_canso.mp3", duration: "4:10" },
          { title: "Quarta Cançó Rock", artist: "Banda Rock", src: "quarta_canso.mp3", duration: "3:50" }
        ]
      },
      "favorites": {
        name: "Preferides",
        songs: [
          { title: "IDK IDK", artist: "B1llyGr4c3", src: "idk idk.mp3", duration: "3:15" },
          { title: "Tercera Cançó Rock", artist: "Banda Rock", src: "tercera_canso.mp3", duration: "4:10" }
        ]
      }
    };

    // 2. Variables d'Estat del Reproductor
    let currentPlaylistKey = "pop";
    let currentSongIndex = 0;
    let isPlaying = false;
    let isShuffle = false;
    let isRepeat = false;

    // 3. Referències als Elements DOM
    const audioPlayer = document.getElementById("audio-player");
    const playBtn = document.getElementById("play-btn");
    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");
    const shuffleBtn = document.getElementById("shuffle-btn");
    const repeatBtn = document.getElementById("repeat-btn");
    
    const trackTitle = document.getElementById("track-title");
    const trackArtist = document.getElementById("track-artist");
    const progressBar = document.getElementById("progress-bar");
    const currentTimeEl = document.getElementById("current-time");
    const totalTimeEl = document.getElementById("total-time");
    
    const playlistSelector = document.getElementById("playlist-selector");
    const songListContainer = document.getElementById("song-list");

    // 4. Funcions d'Inicialització i Renderitzat
    function init() {
      renderPlaylists();
      loadPlaylist(currentPlaylistKey);
      setupEventListeners();
    }

    function renderPlaylists() {
      playlistSelector.innerHTML = "";
      Object.keys(playlists).forEach(key => {
        const btn = document.createElement("button");
        btn.classList.add("playlist-btn");
        if (key === currentPlaylistKey) btn.classList.add("active");
        btn.textContent = playlists[key].name;
        btn.addEventListener("click", () => {
          document.querySelectorAll(".playlist-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          loadPlaylist(key);
        });
        playlistSelector.appendChild(btn);
      });
    }

    function loadPlaylist(key) {
      currentPlaylistKey = key;
      currentSongIndex = 0;
      renderSongList();
      loadSong(currentSongIndex, false);
    }

    function renderSongList() {
      songListContainer.innerHTML = "";
      const currentSongs = playlists[currentPlaylistKey].songs;

      currentSongs.forEach((song, index) => {
        const li = document.createElement("li");
        li.classList.add("song-item");
        if (index === currentSongIndex) li.classList.add("active");

        li.innerHTML = `
          <div class="song-info">
            <span class="title">${song.title}</span>
            <span class="artist">${song.artist}</span>
          </div>
          <span class="song-duration">${song.duration}</span>
        `;

        li.addEventListener("click", () => {
          currentSongIndex = index;
          renderSongList();
          loadSong(currentSongIndex, true);
        });

        songListContainer.appendChild(li);
      });
    }

    // 5. Control de Reproducció de Cançons
    function loadSong(index, shouldPlay = false) {
      const song = playlists[currentPlaylistKey].songs[index];
      if (!song) return;

      audioPlayer.src = song.src;
      trackTitle.textContent = song.title;
      trackArtist.textContent = song.artist;

      if (shouldPlay) {
        playSong();
      } else {
        pauseSong();
      }
    }

    function playSong() {
      isPlaying = true;
      audioPlayer.play().catch(e => console.log("Requerida interacció de l'usuari per reproduir l'àudio."));
      playBtn.textContent = "⏸";
    }

    function pauseSong() {
      isPlaying = false;
      audioPlayer.pause();
      playBtn.textContent = "▶";
    }

    function nextSong() {
      const songs = playlists[currentPlaylistKey].songs;
      if (isShuffle) {
        currentSongIndex = Math.floor(Math.random() * songs.length);
      } else {
        currentSongIndex = (currentSongIndex + 1) % songs.length;
      }
      renderSongList();
      loadSong(currentSongIndex, true);
    }

    function prevSong() {
      const songs = playlists[currentPlaylistKey].songs;
      if (isShuffle) {
        currentSongIndex = Math.floor(Math.random() * songs.length);
      } else {
        currentSongIndex = (currentSongIndex - 1 + songs.length) % songs.length;
      }
      renderSongList();
      loadSong(currentSongIndex, true);
    }

    // 6. Esdeveniments i Actualització d'Interfície
    function setupEventListeners() {
      playBtn.addEventListener("click", () => {
        if (isPlaying) {
          pauseSong();
        } else {
          playSong();
        }
      });

      nextBtn.addEventListener("click", nextSong);
      prevBtn.addEventListener("click", prevSong);

      shuffleBtn.addEventListener("click", () => {
        isShuffle = !isShuffle;
        shuffleBtn.classList.toggle("active", isShuffle);
      });

      repeatBtn.addEventListener("click", () => {
        isRepeat = !isRepeat;
        repeatBtn.classList.toggle("active", isRepeat);
      });

      // Actualització de la barra de progrés en temps real
      audioPlayer.addEventListener("timeupdate", () => {
        if (audioPlayer.duration) {
          const progressPercent = (audioPlayer.currentTime / audioPlayer.duration) * 100;
          progressBar.value = progressPercent;
          currentTimeEl.textContent = formatTime(audioPlayer.currentTime);
          totalTimeEl.textContent = formatTime(audioPlayer.duration);
        }
      });

      // Canviar la posició de la cançó manualment
      progressBar.addEventListener("input", () => {
        if (audioPlayer.duration) {
          const seekTime = (progressBar.value / 100) * audioPlayer.duration;
          audioPlayer.currentTime = seekTime;
        }
      });

      // Esdeveniment al finalitzar la cançó
      audioPlayer.addEventListener("ended", () => {
        if (isRepeat) {
          loadSong(currentSongIndex, true);
        } else {
          nextSong();
        }
      });
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    // Inicialitza l'aplicació
    init();
  </script>
</body>
</html></html>
