<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MUSIC</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">

  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --card-hover: #2a2a2a;
      --accent-color: #4EAFD9;
      --text-main: #ffffff;
      --text-secondary: #b3b3b3;
      --border-color: #282828;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    /* CONTENIDOR PRINCIPAL */
    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      max-width: 100%;
      margin: 0 auto;
      background-color: var(--bg-color);
    }

    /* SECCIÓ SUPERIOR / ESQUERRA: REPRODUCTOR */
    .player-section {
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #1f2d34 0%, var(--bg-color) 100%);
      flex-shrink: 0;
    }

    .album-art {
      width: 150px;
      height: 150px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.7);
      margin-bottom: 15px;
      background-color: var(--card-bg);
      transition: transform 0.3s ease;
    }

    .album-art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .track-info {
      text-align: center;
      margin-bottom: 15px;
      width: 100%;
      max-width: 320px;
    }

    .track-info h2 {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-info p {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    /* BARRA DE PROGRÉS */
    .progress-box {
      width: 100%;
      max-width: 320px;
      margin-bottom: 12px;
    }

    .progress-bar {
      width: 100%;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      border-radius: 2px;
      background: #3e3e3e;
      outline: none;
      cursor: pointer;
    }

    .progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent-color);
      cursor: pointer;
    }

    .time-stamps {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 6px;
    }

    /* CONTROLS */
    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 320px;
    }

    .btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 20px;
      cursor: pointer;
      padding: 10px;
      border-radius: 50%;
      transition: background 0.2s, color 0.2s;
    }

    .btn:hover {
      color: var(--text-main);
    }

    .btn.active {
      color: var(--accent-color);
    }

    .btn-play {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background-color: var(--accent-color);
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .btn-play:hover {
      transform: scale(1.05);
      background-color: #5cc2ed;
    }

    /* SECCIÓ INFERIOR / DRETA: LLISTA DE CANÇONS */
    .playlist-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 15px 20px;
      border-top: 1px solid var(--border-color);
      background-color: var(--bg-color);
    }

    .playlist-selector {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    .tab-btn {
      background-color: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      white-space: nowrap;
      cursor: pointer;
    }

    .tab-btn.active {
      background-color: var(--accent-color);
      color: #000;
      font-weight: bold;
      border-color: var(--accent-color);
    }

    .song-list {
      list-style: none;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .song-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-radius: 8px;
      background-color: var(--card-bg);
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .song-item:hover {
      background-color: var(--card-hover);
    }

    .song-item.active {
      border: 1px solid var(--accent-color);
      background-color: #1a272e;
    }

    .song-item.active .song-title {
      color: var(--accent-color);
      font-weight: bold;
    }

    .song-title {
      font-size: 14px;
      color: var(--text-main);
    }

    .song-artist {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .song-duration {
      font-size: 12px;
      color: var(--text-secondary);
    }

    /* ========================================================= */
    /* ADAPTACIÓ PER A ORDINADOR / PANTALLES GRANS (min-width: 768px) */
    /* ========================================================= */
    @media (min-width: 768px) {
      .app-container {
        flex-direction: row; /* Panells un al costat de l'altre */
        max-width: 1000px;
        height: 85vh;
        margin: 7.5vh auto;
        border-radius: 16px;
        overflow: hidden;
        border: 1px solid var(--border-color);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      }

      .player-section {
        flex: 1;
        padding: 40px;
        border-right: 1px solid var(--border-color);
        background: linear-gradient(180deg, #1b2830 0%, #121212 100%);
      }

      .album-art {
        width: 240px;
        height: 240px;
        margin-bottom: 25px;
      }

      .track-info h2 {
        font-size: 22px;
      }

      .playlist-section {
        flex: 1.2;
        padding: 30px;
        border-top: none;
      }

      .song-item {
        padding: 14px 18px;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- Reproductor (A dalt en Mòbil, a l'Esquerra en PC) -->
    <div class="player-section">
      <div class="album-art">
        <img src="logo.png" alt="Portada">
      </div>

      <div class="track-info">
        <h2 id="track-title">Selecciona una cançó</h2>
        <p id="track-artist">-</p>
      </div>

      <div class="progress-box">
        <input type="range" id="progress-bar" class="progress-bar" value="0" min="0" step="0.1">
        <div class="time-stamps">
          <span id="current-time">0:00</span>
          <span id="total-time">0:00</span>
        </div>
      </div>

      <div class="controls">
        <button class="btn" id="shuffle-btn" title="Aleatori">🔀</button>
        <button class="btn" id="prev-btn" title="Anterior">⏮</button>
        <button class="btn btn-play" id="play-btn" title="Reproduir / Pausar">▶</button>
        <button class="btn" id="next-btn" title="Següent">⏭</button>
        <button class="btn" id="repeat-btn" title="Repetir">🔁</button>
      </div>
    </div>

    <!-- Llista de Cançons (A baix en Mòbil, a la Dreta en PC) -->
    <div class="playlist-section">
      <div class="playlist-selector" id="playlist-selector"></div>
      <ul class="song-list" id="song-list"></ul>
    </div>

  </div>

  <audio id="audio-player"></audio>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(err => console.error(err));
    }

    const playlists = {
      "pop": {
        name: "Pop Hits",
        songs: [
          { title: "IDK IDK", artist: "B1llyGr4c3", src: "idk idk.mp3", duration: "3:15" },
          { title: "Feel You", artist: "Artista A", src: "Feel You.mp3", duration: "2:58" }
        ]
      }
    };

    let currentPlaylistKey = "pop";
    let currentSongIndex = 0;
    let isPlaying = false;
    let isShuffle = false;
    let isRepeat = false;

    const audioPlayer = document.getElementById("audio-player");
    const playBtn = document.getElementById("play-btn");
    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");
    const shuffleBtn = document.getElementById("shuffle-btn");
    const repeatBtn = document.getElementById("repeat-btn");
    
    const trackTitle = document.getElementById("track-title");
    const trackArtist = document.getElementById("track-artist");
    const progressBar = document.getElementById("progress-bar");
    const currentTimeEl = document.getElementById("current-time");
    const totalTimeEl = document.getElementById("total-time");
    
    const playlistSelector = document.getElementById("playlist-selector");
    const songListContainer = document.getElementById("song-list");

    function init() {
      renderPlaylists();
      loadPlaylist(currentPlaylistKey);
      setupEventListeners();
    }

    function renderPlaylists() {
      playlistSelector.innerHTML = "";
      Object.keys(playlists).forEach(key => {
        const btn = document.createElement("button");
        btn.classList.add("tab-btn");
        if (key === currentPlaylistKey) btn.classList.add("active");
        btn.textContent = playlists[key].name;
        btn.addEventListener("click", () => {
          document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          loadPlaylist(key);
        });
        playlistSelector.appendChild(btn);
      });
    }

    function loadPlaylist(key) {
      currentPlaylistKey = key;
      currentSongIndex = 0;
      renderSongList();
      loadSong(currentSongIndex, false);
    }

    function renderSongList() {
      songListContainer.innerHTML = "";
      const currentSongs = playlists[currentPlaylistKey].songs;

      currentSongs.forEach((song, index) => {
        const li = document.createElement("li");
        li.classList.add("song-item");
        if (index === currentSongIndex) li.classList.add("active");

        li.innerHTML = `
          <div>
            <div class="song-title">${song.title}</div>
            <div class="song-artist">${song.artist}</div>
          </div>
          <div class="song-duration">${song.duration}</div>
        `;

        li.addEventListener("click", () => {
          currentSongIndex = index;
          renderSongList();
          loadSong(currentSongIndex, true);
        });

        songListContainer.appendChild(li);
      });
    }

    function loadSong(index, shouldPlay = false) {
      const song = playlists[currentPlaylistKey].songs[index];
      if (!song) return;

      audioPlayer.src = song.src;
      trackTitle.textContent = song.title;
      trackArtist.textContent = song.artist;

      if (shouldPlay) playSong();
      else pauseSong();
    }

    function playSong() {
      isPlaying = true;
      audioPlayer.play().catch(() => {});
      playBtn.textContent = "⏸";
    }

    function pauseSong() {
      isPlaying = false;
      audioPlayer.pause();
      playBtn.textContent = "▶";
    }

    function nextSong() {
      const songs = playlists[currentPlaylistKey].songs;
      currentSongIndex = isShuffle ? Math.floor(Math.random() * songs.length) : (currentSongIndex + 1) % songs.length;
      renderSongList();
      loadSong(currentSongIndex, true);
    }

    function prevSong() {
      const songs = playlists[currentPlaylistKey].songs;
      currentSongIndex = isShuffle ? Math.floor(Math.random() * songs.length) : (currentSongIndex - 1 + songs.length) % songs.length;
      renderSongList();
      loadSong(currentSongIndex, true);
    }

    function setupEventListeners() {
      playBtn.addEventListener("click", () => isPlaying ? pauseSong() : playSong());
      nextBtn.addEventListener("click", nextSong);
      prevBtn.addEventListener("click", prevSong);

      shuffleBtn.addEventListener("click", () => {
        isShuffle = !isShuffle;
        shuffleBtn.classList.toggle("active", isShuffle);
      });

      repeatBtn.addEventListener("click", () => {
        isRepeat = !isRepeat;
        repeatBtn.classList.toggle("active", isRepeat);
      });

      audioPlayer.addEventListener("timeupdate", () => {
        if (audioPlayer.duration) {
          progressBar.value = (audioPlayer.currentTime / audioPlayer.duration) * 100;
          currentTimeEl.textContent = formatTime(audioPlayer.currentTime);
          totalTimeEl.textContent = formatTime(audioPlayer.duration);
        }
      });

      progressBar.addEventListener("input", () => {
        if (audioPlayer.duration) {
          audioPlayer.currentTime = (progressBar.value / 100) * audioPlayer.duration;
        }
      });

      audioPlayer.addEventListener("ended", () => isRepeat ? loadSong(currentSongIndex, true) : nextSong());
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    init();
  </script>
</body>
</html>
