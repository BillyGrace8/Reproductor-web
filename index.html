<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MUSIC</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">

  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #212121;
      --card-bg2: #1e1e1e;
      --accent-color: #4EAFD9;
      --text-main: #ffffff;
      --text-secondary: #a7a7a7;
      --border-color: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh; /* Suport per a altures dinàmiques en mòbils */
      overflow: hidden;
    }

    .navbar {
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #1a1a1a;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border-color);
    }

    .navbar h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 1px;
      color: var(--text-main);
    }

    .main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
      flex-direction: column;
    }

    @media (min-width: 768px) {
      .main-container {
        flex-direction: row;
      }
    }

    /* Panell del Reproductor */
    .player-panel {
      flex: 1.2;
      background-color: var(--bg-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .album-art {
      width: 200px;
      height: 200px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      margin-bottom: 20px;
      background-color: #2a2a2a;
    }

    .album-art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .current-track-info {
      text-align: center;
      margin-bottom: 15px;
      width: 100%;
      padding: 0 10px;
    }

    .current-track-info h2 {
      font-size: 18px;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .current-track-info p {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .progress-container {
      width: 100%;
      max-width: 320px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .progress-time {
      font-size: 11px;
      color: var(--text-secondary);
      width: 30px;
      text-align: center;
    }

    .progress-bar {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      border-radius: 4px;
      background: #333333;
      outline: none;
    }

    .progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent-color);
      cursor: pointer;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      width: 100%;
    }

    .control-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 22px;
      cursor: pointer;
      padding: 10px;
      border-radius: 50%;
      transition: color 0.2s, transform 0.1s;
    }

    .control-btn:active {
      transform: scale(0.9);
    }

    .control-btn.active {
      color: var(--accent-color);
    }

    .control-btn.play-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background-color: var(--accent-color);
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    /* Panell Lateral / Llista */
    .sidebar {
      flex: 1;
      background-color: var(--card-bg2);
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 15px;
    }

    @media (min-width: 768px) {
      .sidebar {
        border-top: none;
        border-right: 1px solid var(--border-color);
      }
    }

    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-secondary);
      margin-bottom: 8px;
      margin-top: 10px;
    }

    .section-title:first-child {
      margin-top: 0;
    }

    .playlist-selector {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      overflow-x: auto;
      padding-bottom: 5px;
    }

    .playlist-btn {
      background-color: #2a2a2a;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }

    .playlist-btn.active {
      background-color: var(--accent-color);
      color: #000;
      font-weight: bold;
    }

    .song-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .song-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      background-color: #262626;
    }

    .song-item.active {
      border: 1px solid var(--accent-color);
    }

    .song-item.active .song-info .title {
      color: var(--accent-color);
      font-weight: bold;
    }

    .song-info {
      display: flex;
      flex-direction: column;
    }

    .song-info .title {
      font-size: 14px;
      color: var(--text-main);
    }

    .song-info .artist {
      font-size: 11px;
      color: var(--text-secondary);
    }

    .song-duration {
      font-size: 11px;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>

  <div class="navbar">
    <h1>MUSIC</h1>
  </div>

  <div class="main-container">

    <div class="player-panel">
      <div class="album-art">
        <img src="logo.png" alt="Portada">
      </div>

      <div class="current-track-info">
        <h2 id="track-title">Cap cançó seleccionada</h2>
        <p id="track-artist">-</p>
      </div>

      <div class="progress-container">
        <span class="progress-time" id="current-time">0:00</span>
        <input type="range" id="progress-bar" class="progress-bar" value="0" min="0" step="0.1">
        <span class="progress-time" id="total-time">0:00</span>
      </div>

      <div class="controls">
        <button class="control-btn" id="shuffle-btn" title="Aleatori">🔀</button>
        <button class="control-btn" id="prev-btn" title="Anterior">⏮</button>
        <button class="control-btn play-btn" id="play-btn" title="Reproduir / Pausar">▶</button>
        <button class="control-btn" id="next-btn" title="Següent">⏭</button>
        <button class="control-btn" id="repeat-btn" title="Repetir">🔁</button>
      </div>
    </div>

    <div class="sidebar">
      <div class="section-title">Llistes</div>
      <div class="playlist-selector" id="playlist-selector"></div>

      <div class="section-title">Cançons</div>
      <ul class="song-list" id="song-list"></ul>
    </div>

  </div>

  <audio id="audio-player"></audio>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then(() => console.log('Service Worker registrat'))
        .catch(err => console.error('Error SW:', err));
    }

    const playlists = {
      "pop": {
        name: "Pop Hits",
        songs: [
          { title: "IDK IDK", artist: "B1llyGr4c3", src: "idk idk.mp3", duration: "3:15" },
          { title: "Feel You", artist: "Artista A", src: "Feel You.mp3", duration: "2:58" }
        ]
      }
    };

    let currentPlaylistKey = "pop";
    let currentSongIndex = 0;
    let isPlaying = false;
    let isShuffle = false;
    let isRepeat = false;

    const audioPlayer = document.getElementById("audio-player");
    const playBtn = document.getElementById("play-btn");
    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");
    const shuffleBtn = document.getElementById("shuffle-btn");
    const repeatBtn = document.getElementById("repeat-btn");
    
    const trackTitle = document.getElementById("track-title");
    const trackArtist = document.getElementById("track-artist");
    const progressBar = document.getElementById("progress-bar");
    const currentTimeEl = document.getElementById("current-time");
    const totalTimeEl = document.getElementById("total-time");
    
    const playlistSelector = document.getElementById("playlist-selector");
    const songListContainer = document.getElementById("song-list");

    function init() {
      renderPlaylists();
      loadPlaylist(currentPlaylistKey);
      setupEventListeners();
    }

    function renderPlaylists() {
      playlistSelector.innerHTML = "";
      Object.keys(playlists).forEach(key => {
        const btn = document.createElement("button");
        btn.classList.add("playlist-btn");
        if (key === currentPlaylistKey) btn.classList.add("active");
        btn.textContent = playlists[key].name;
        btn.addEventListener("click", () => {
          document.querySelectorAll(".playlist-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          loadPlaylist(key);
        });
        playlistSelector.appendChild(btn);
      });
    }

    function loadPlaylist(key) {
      currentPlaylistKey = key;
      currentSongIndex = 0;
      renderSongList();
      loadSong(currentSongIndex, false);
    }

    function renderSongList() {
      songListContainer.innerHTML = "";
      const currentSongs = playlists[currentPlaylistKey].songs;

      currentSongs.forEach((song, index) => {
        const li = document.createElement("li");
        li.classList.add("song-item");
        if (index === currentSongIndex) li.classList.add("active");

        li.innerHTML = `
          <div class="song-info">
            <span class="title">${song.title}</span>
            <span class="artist">${song.artist}</span>
          </div>
          <span class="song-duration">${song.duration}</span>
        `;

        li.addEventListener("click", () => {
          currentSongIndex = index;
          renderSongList();
          loadSong(currentSongIndex, true);
        });

        songListContainer.appendChild(li);
      });
    }

    function loadSong(index, shouldPlay = false) {
      const song = playlists[currentPlaylistKey].songs[index];
      if (!song) return;

      audioPlayer.src = song.src;
      trackTitle.textContent = song.title;
      trackArtist.textContent = song.artist;

      if (shouldPlay) {
        playSong();
      } else {
        pauseSong();
      }
    }

    function playSong() {
      isPlaying = true;
      audioPlayer.play().catch(e => console.log("Prem per reproduir"));
      playBtn.textContent = "⏸";
    }

    function pauseSong() {
      isPlaying = false;
      audioPlayer.pause();
      playBtn.textContent = "▶";
    }

    function nextSong() {
      const songs = playlists[currentPlaylistKey].songs;
      currentSongIndex = isShuffle ? Math.floor(Math.random() * songs.length) : (currentSongIndex + 1) % songs.length;
      renderSongList();
      loadSong(currentSongIndex, true);
    }

    function prevSong() {
      const songs = playlists[currentPlaylistKey].songs;
      currentSongIndex = isShuffle ? Math.floor(Math.random() * songs.length) : (currentSongIndex - 1 + songs.length) % songs.length;
      renderSongList();
      loadSong(currentSongIndex, true);
    }

    function setupEventListeners() {
      playBtn.addEventListener("click", () => isPlaying ? pauseSong() : playSong());
      nextBtn.addEventListener("click", nextSong);
      prevBtn.addEventListener("click", prevSong);

      shuffleBtn.addEventListener("click", () => {
        isShuffle = !isShuffle;
        shuffleBtn.classList.toggle("active", isShuffle);
      });

      repeatBtn.addEventListener("click", () => {
        isRepeat = !isRepeat;
        repeatBtn.classList.toggle("active", isRepeat);
      });

      audioPlayer.addEventListener("timeupdate", () => {
        if (audioPlayer.duration) {
          progressBar.value = (audioPlayer.currentTime / audioPlayer.duration) * 100;
          currentTimeEl.textContent = formatTime(audioPlayer.currentTime);
          totalTimeEl.textContent = formatTime(audioPlayer.duration);
        }
      });

      progressBar.addEventListener("input", () => {
        if (audioPlayer.duration) {
          audioPlayer.currentTime = (progressBar.value / 100) * audioPlayer.duration;
        }
      });

      audioPlayer.addEventListener("ended", () => isRepeat ? loadSong(currentSongIndex, true) : nextSong());
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    init();
  </script>
</body>
</html>
